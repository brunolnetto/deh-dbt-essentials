name: dbt CI

on:
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Parse project
        run: uv run dbt parse

      - name: Build project
        run: uv run dbt build

