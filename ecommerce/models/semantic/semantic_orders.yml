semantic_models:
  - name: orders
    description: >
      Semantic model over the fct_orders fact table.
      Grain: one row per order. Soft-deleted orders are included here;
      filtering is handled at query time via the status or deleted_at dimension.
    model: ref('fct_orders')

    entities:
      - name: order
        type: primary
        expr: order_id
      - name: customer
        type: foreign
        expr: customer_id

    dimensions:
      - name: order_date
        description: Date the order was placed. Use as the primary time axis.
        type: time
        type_params:
          time_granularity: day
      - name: status
        description: Operational order status (pending / paid / cancelled / refunded).
        type: categorical

    measures:
      - name: order_count
        description: Distinct count of orders.
        agg: count_distinct
        expr: order_id

      - name: paid_order_count
        description: Number of paid orders (sum of is_paid flag).
        agg: sum
        expr: is_paid

      - name: refunded_order_count
        description: Number of refunded orders (sum of is_refunded flag).
        agg: sum
        expr: is_refunded

      - name: recognized_revenue
        description: Sum of recognized revenue across paid orders.
        agg: sum
        expr: recognized_revenue

      - name: refunded_amount
        description: Sum of refunded amounts across refunded orders.
        agg: sum
        expr: refunded_amount


metrics:
  - name: revenue
    description: Total recognized revenue from paid orders.
    type: simple
    type_params:
      measure: recognized_revenue

  - name: paid_orders
    description: Total number of paid orders.
    type: simple
    type_params:
      measure: paid_order_count

  - name: average_order_value
    description: >
      Revenue per paid order. Computed as recognized_revenue / paid_order_count
      to avoid averaging pre-aggregated averages.
    type: ratio
    type_params:
      numerator: recognized_revenue
      denominator: paid_order_count

  - name: refund_rate
    description: >
      Proportion of orders that were refunded, by count.
      Answers: "what fraction of orders get refunded?"
    type: ratio
    type_params:
      numerator: refunded_order_count
      denominator: order_count

  - name: refund_amount_ratio
    description: >
      Proportion of revenue that was refunded, by value.
      Answers: "what fraction of revenue is lost to refunds?"
      Kept separate from refund_rate — they represent different business semantics.
    type: ratio
    type_params:
      numerator: refunded_amount
      denominator: recognized_revenue
